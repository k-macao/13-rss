name: AIHOT source validation

# Runs the AIHOT demo-source candidates against the live web. The authoring sandbox
# has no outbound access to feed hosts, so the checks run on a GitHub-hosted runner
# and the round report is committed back to the branch.
on:
  workflow_dispatch:
    inputs:
      round:
        description: "Validation round number (1, 2, 3)"
        type: string
        required: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and parse every candidate
        run: |
          python tools/validate_aihot_sources.py \
            --round "${{ inputs.round }}" \
            --input sources/aihot-curated.json \
            --output "reports/aihot-validation-round-${{ inputs.round }}.json"
      - name: Show the round summary
        run: |
          python - <<'PY'
          import json
          path = "reports/aihot-validation-round-${{ inputs.round }}.json"
          data = json.load(open(path, encoding="utf-8"))
          print(f"round {data['round']}: {data['passed']}/{data['candidate_count']} passed")
          for item in data["results"]:
              status = "ok " if item["ok"] else "FAIL"
              print(f"{status} {item['title']} :: {item.get('format', '-')} "
                    f"items={item.get('items_captured', 0)} latest={item.get('latest_item_at')} "
                    f"resolved={item.get('resolved_url', item['feed_url'])}")
          PY
      - name: Commit the round report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reports/aihot-validation-round-${{ inputs.round }}.json"
          if git diff --cached --quiet; then
            echo "no report change to commit"
            exit 0
          fi
          git commit -m "Record AIHOT source validation round ${{ inputs.round }}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
