name: AIHOT source validation

# Runs the AIHOT demo-source candidates against the live web. The authoring sandbox
# has no outbound access to feed hosts, so the checks run on a GitHub-hosted runner
# and the round reports are committed back to the branch. A pull_request trigger is
# used because pull_request runs take the workflow definition from the head branch,
# which lets this round be validated before the file reaches the default branch.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "How many rounds to run"
        type: string
        default: "3"
      interval_seconds:
        description: "Pause between rounds"
        type: string
        default: "240"
  pull_request:
    paths:
      - .github/workflows/aihot-validation.yml
      - sources/aihot-curated.json
      - tools/validate_aihot_sources.py

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aihot-source-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the validation rounds
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
          INTERVAL: ${{ inputs.interval_seconds || '240' }}
        run: |
          set -euo pipefail
          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::round $round"
            python tools/validate_aihot_sources.py \
              --round "$round" \
              --input sources/aihot-curated.json \
              --output "reports/aihot-validation-round-$round.json"
            echo "::endgroup::"
            if [ "$round" -lt "$ROUNDS" ]; then
              echo "waiting $INTERVAL seconds before round $((round + 1))"
              sleep "$INTERVAL"
            fi
          done
      - name: Summarize the rounds
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("reports").glob("aihot-validation-round-*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"\n== {path.name}: {data['passed']}/{data['candidate_count']} passed")
              for item in data["results"]:
                  status = "ok  " if item["ok"] else "FAIL"
                  print(
                      f"{status} {item['title'][:42]:44} {item.get('format', '-'):9}"
                      f" items={item.get('items_captured', 0):>3}"
                      f" latest={item.get('latest_item_at')}"
                      f" resolved={item.get('resolved_url', item['feed_url'])}"
                      f" {item.get('error', '')}"
                  )
          PY
      - name: Commit the round reports
        id: commit
        continue-on-error: true
        env:
          ROUNDS: ${{ inputs.rounds || '3' }}
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for round in $(seq 1 "$ROUNDS"); do
            git add -f "reports/aihot-validation-round-$round.json"
          done
          if git diff --cached --quiet; then
            echo "no report change to commit"
            echo "push_exit=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Record AIHOT source validation rounds 1-$ROUNDS"
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" 2>&1 | tee push.log
          echo "push_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Publish the rounds as a pull request comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ROUNDS: ${{ inputs.rounds || '3' }}
          PUSH_EXIT: ${{ steps.commit.outputs.push_exit }}
        run: |
          set -eo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rounds = int(os.environ.get("ROUNDS", "3"))
          push_exit = os.environ.get("PUSH_EXIT", "unknown")
          lines = [
              "<!-- aihot-validation-rounds -->",
              "### AIHOT source validation rounds",
              "",
              f"Rounds: `{rounds}` · push back to the branch exit code: `{push_exit}`",
              "",
          ]
          for round in range(1, rounds + 1):
              path = Path(f"reports/aihot-validation-round-{round}.json")
              if not path.exists():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              compact = []
              for item in data["results"]:
                  compact.append({
                      "round": data["round"],
                      "checked_at": item.get("checked_at"),
                      "ok": item.get("ok"),
                      "title": item.get("title"),
                      "feed_url": item.get("feed_url"),
                      "http_status": item.get("http_status"),
                      "format": item.get("format"),
                      "items_captured": item.get("items_captured"),
                      "channel_title": item.get("channel_title"),
                      "channel_language": item.get("channel_language"),
                      "latest_item_at": item.get("latest_item_at"),
                      "resolved_url": item.get("resolved_url"),
                      "error": item.get("error"),
                  })
              body = json.dumps(compact, ensure_ascii=False, indent=1)
              lines.extend([
                  f"<details><summary>round {round} — {data['passed']}/{data['candidate_count']} passed</summary>",
                  "",
                  "```json",
                  body,
                  "```",
                  "",
                  "</details>",
                  "",
              ])
          Path("aihot-rounds.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"comment size: {len(chr(10).join(lines))} characters")
          PY
          gh pr comment "$PR_NUMBER" --body-file aihot-rounds.md
