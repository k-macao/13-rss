name: WeChat digest

# Beijing time (UTC+8) 09:00 and 18:00 -> 01:00 and 10:00 UTC.
# GitHub cron runs on UTC and can be delayed by a few minutes under load.
on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: "Which edition to render"
        type: choice
        options: [auto, morning, evening]
        default: auto
      pack:
        description: "OPML pack to read (all, top200, ai, news, ...)"
        type: string
        default: all
      window_hours:
        description: "Lookback window in hours (0 = edition default)"
        type: string
        default: "0"
      dry_run:
        description: "Render only, do not call pushplus"
        type: boolean
        default: false
      summarize:
        description: "Write an AI line under each article"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wechat-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve edition
        id: edition
        env:
          INPUT_EDITION: ${{ inputs.edition }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -n "$INPUT_EDITION" ] && [ "$INPUT_EDITION" != "auto" ]; then
            echo "name=$INPUT_EDITION" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 10 * * *" ]; then
            echo "name=evening" >> "$GITHUB_OUTPUT"
          else
            echo "name=morning" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push digest
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
          # Translation is a chain: the keyed providers below are tried first and
          # the keyless ones follow. Keys are optional — without them the digest
          # still renders, and the run summary says which endpoint answered.
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          TRANSLATE_LLM_API_KEY: ${{ secrets.TRANSLATE_LLM_API_KEY }}
          # DeepSeek needs no other variable: the script's preset supplies the
          # endpoint and a current model ID, so a key stored under either name
          # (TRANSLATE_LLM_API_KEY or DEEPSEEK_API_KEY) works on its own.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.DEEPSEEK_KEY }}
          TRANSLATE_LLM_PROVIDER: ${{ vars.TRANSLATE_LLM_PROVIDER }}
          TRANSLATE_LLM_BASE_URL: ${{ vars.TRANSLATE_LLM_BASE_URL }}
          TRANSLATE_LLM_MODEL: ${{ vars.TRANSLATE_LLM_MODEL }}
          TRANSLATE_PROVIDERS: ${{ vars.TRANSLATE_PROVIDERS }}
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
          # The AI line reuses the llm endpoint above; this variable picks a
          # different model for it when a deeper one is wanted. Optional.
          SUMMARY_LLM_MODEL: ${{ vars.SUMMARY_LLM_MODEL }}
        run: |
          python scripts/wechat_digest.py \
            --pack "${{ inputs.pack || 'all' }}" \
            --edition "${{ steps.edition.outputs.name }}" \
            --window-hours "${{ inputs.window_hours || '0' }}" \
            --max-per-feed 3 \
            --max-items 120 \
            --concurrency 12 \
            --timeout 20 \
            --out build/digest \
            ${{ (inputs.summarize == false) && '--no-summarize' || '' }} \
            ${{ (inputs.dry_run == true) && '--dry-run' || '' }}

      - name: Show the translation and AI summary report
        if: always()
        run: cat build/digest/translation-report.md 2>/dev/null || echo "no translation report"

      - name: Upload rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wechat-digest-${{ steps.edition.outputs.name }}
          path: build/digest
          if-no-files-found: ignore
          retention-days: 7
